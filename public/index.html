<!doctype html>
<!--
  Página única del portafolio.
  Este archivo solo define la estructura. El contenido (nombre, fotos, redes…)
  lo rellena app.js con los datos que envía el servidor, y el aspecto lo
  define styles.css.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portafolio Lyda</title>
  <!-- Icono de la pestaña. app.js lo sustituye por uno con las iniciales del nombre. -->
  <link rel="icon" id="favicon" href="data:,">
  <!-- Tipografías de Google Fonts: Cormorant Garamond (títulos) y Jost (textos). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica el tema guardado antes de pintar la página, para evitar un parpadeo.
    try {
      const theme = localStorage.getItem('theme');
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <!-- Barra superior fija: iniciales con menú, botón de tema y enlaces a las secciones. -->
  <nav class="topbar">
    <div class="brand">
      <!-- Menú desplegable: al pulsar las iniciales aparece la opción de editar. -->
      <div class="menu">
        <button id="menu-btn" class="monogram" aria-haspopup="true" aria-expanded="false" aria-controls="menu-list">
          <span id="monogram"></span>
          <svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
        </button>
        <div id="menu-list" class="menu-list" hidden>
          <button id="admin-btn" class="menu-item">Editar</button>
        </div>
      </div>
      <!-- Botón de tema: app.js le pone el icono de luna o sol. -->
      <button id="theme-btn" class="icon-btn" aria-label="Activar modo oscuro"></button>
    </div>
    <div class="links">
      <a href="#portafolio">Portafolio</a>
      <a href="#about">Sobre mí</a>
      <a href="#eventos">Eventos</a>
      <a href="#shootings">Shootings</a>
      <a href="#contact">Contacto</a>
    </div>
  </nav>

  <!-- Portada: nombre a la izquierda y foto principal a la derecha. -->
  <header class="hero" id="top">
    <div class="hero-text">
      <p id="tagline" class="eyebrow"></p>
      <h1 id="name">Portafolio Lyda</h1>
      <p id="location" class="location"></p>
      <a href="#portafolio" class="scroll-cue">Ver portafolio</a>
    </div>
    <div class="hero-image" id="hero-image">
      <span class="placeholder">Tu foto principal aparecerá aquí</span>
    </div>
  </header>

  <!-- Ficha de medidas (comp card). Se rellena con "stats" de config.json. -->
  <section class="stats" aria-label="Medidas">
    <dl id="stats"></dl>
  </section>

  <main id="portafolio">
    <div class="section-head">
      <span class="section-num">01</span>
      <h2>Portafolio</h2>
    </div>

    <!-- Formulario para subir fotos. Solo se ve en modo edición.
         Las clases dropzone, previews, drop-text y msg las usa app.js
         (el formulario de eventos tiene la misma estructura). -->
    <form id="upload-form" class="upload hidden">
      <label class="dropzone">
        <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif" required>
        <div class="previews"></div>
        <span class="drop-text">Arrastra una fotografía aquí<br>o haz clic para elegirla</span>
      </label>
      <div class="fields">
        <p class="eyebrow">Nueva fotografía</p>
        <input type="text" name="title" placeholder="Título · ej. Vogue Editorial" maxlength="100">
        <textarea name="description" placeholder="Descripción · fotógrafo, marca, año…" maxlength="500" rows="3"></textarea>
        <button type="submit" class="btn">Subir</button>
        <p class="msg" role="status"></p>
      </div>
    </form>

    <!-- Galería: app.js crea aquí una tarjeta por cada foto. -->
    <p id="empty" class="empty hidden">Aún no hay fotografías. Pulsa <em>Editar</em> para subir la primera.</p>
    <section id="gallery" class="gallery"></section>
  </main>

  <!-- Biografía ("bio" en config.json). -->
  <section class="about" id="about">
    <div class="section-head">
      <span class="section-num">02</span>
      <h2>Sobre mí</h2>
    </div>
    <p id="bio" class="bio"></p>
  </section>

  <!-- Eventos: tarjetas con imagen, título y descripción.
       Si no hay ninguno, app.js muestra el aviso "No hay eventos registrados". -->
  <section class="events" id="eventos">
    <div class="section-head">
      <span class="section-num">03</span>
      <h2>Eventos</h2>
      <!-- Solo visible en modo edición: abre el formulario de nuevo evento. -->
      <button id="add-event-btn" class="btn btn-outline hidden">+ Añadir evento</button>
    </div>

    <form id="event-form" class="upload hidden">
      <label class="dropzone">
        <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif" required>
        <div class="previews"></div>
        <span class="drop-text">Arrastra la imagen del evento<br>o haz clic para elegirla</span>
      </label>
      <div class="fields">
        <p class="eyebrow">Nuevo evento</p>
        <input type="text" name="title" placeholder="Título · ej. Bogotá Fashion Week 2026" maxlength="100" required>
        <textarea name="description" placeholder="Descripción · lugar, fecha, marcas, tu participación…" maxlength="500" rows="5"></textarea>
        <div class="form-actions">
          <button type="submit" class="btn">Publicar</button>
          <button type="button" class="btn btn-outline" id="cancel-event-btn">Cancelar</button>
        </div>
        <p class="msg" role="status"></p>
      </div>
    </form>

    <p id="events-empty" class="empty hidden"></p>
    <div id="events-list" class="events-list"></div>
  </section>

  <!-- Shootings: cada tarjeta muestra la portada y, al avanzar, un collage de
       4 imágenes. Si no hay ninguno, app.js muestra "No hay shootings registrados". -->
  <section class="shootings" id="shootings">
    <div class="section-head">
      <span class="section-num">04</span>
      <h2>Shootings</h2>
      <!-- Solo visible en modo edición: abre el formulario de nuevo shooting. -->
      <button id="add-shooting-btn" class="btn btn-outline hidden">+ Añadir shooting</button>
    </div>

    <form id="shooting-form" class="upload hidden">
      <div class="dropzones">
        <label class="dropzone">
          <input type="file" name="cover" accept="image/jpeg,image/png,image/webp,image/gif" required>
          <div class="previews"></div>
          <span class="drop-text">Portada<br>arrastra una imagen o haz clic</span>
        </label>
        <!-- "multiple" permite elegir varias imágenes; app.js comprueba que sean 4. -->
        <label class="dropzone">
          <input type="file" name="images" accept="image/jpeg,image/png,image/webp,image/gif" multiple required data-count="4">
          <div class="previews"></div>
          <span class="drop-text">Collage · 4 imágenes<br>selecciónalas todas a la vez</span>
        </label>
      </div>
      <div class="fields">
        <p class="eyebrow">Nuevo shooting</p>
        <input type="text" name="title" placeholder="Título · ej. Editorial Primavera" maxlength="100" required>
        <textarea name="description" placeholder="Descripción · fotógrafo, marca, lugar…" maxlength="500" rows="5"></textarea>
        <div class="form-actions">
          <button type="submit" class="btn">Publicar</button>
          <button type="button" class="btn btn-outline" id="cancel-shooting-btn">Cancelar</button>
        </div>
        <p class="msg" role="status"></p>
      </div>
    </form>

    <p id="shootings-empty" class="empty hidden"></p>
    <div id="shootings-list" class="shootings-list"></div>
  </section>

  <!-- Contacto: correo y redes sociales (config.json). -->
  <section class="contact" id="contact">
    <div class="section-head">
      <span class="section-num">05</span>
      <h2>Contacto</h2>
    </div>
    <a id="email" class="email hidden"></a>
    <nav id="social" class="social" aria-label="Redes sociales"></nav>
  </section>

  <!-- Visor a pantalla completa. <dialog> es un elemento nativo del navegador
       para ventanas emergentes: se cierra solo con la tecla Esc. -->
  <dialog id="lightbox" class="lightbox">
    <button class="close" aria-label="Cerrar">×</button>
    <button class="nav prev" aria-label="Anterior">‹</button>
    <button class="nav next" aria-label="Siguiente">›</button>
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption>
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-desc"></p>
      </figcaption>
    </figure>
  </dialog>

  <footer>© <span id="year"></span> <span id="footer-name"></span></footer>

  <!-- Botones flotantes de la esquina inferior derecha, apilados en columna. -->
  <div class="fab-stack">
    <!-- Volver al inicio: aparece al bajar más allá de la portada (ver app.js). -->
    <button id="to-top" class="fab fab-outline away" aria-label="Volver al inicio" title="Volver al inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>

    <!-- Enlace al repositorio de GitHub ("github" en config.json). -->
    <a id="github-link" class="fab hidden" target="_blank" rel="noopener noreferrer"
       aria-label="Ver el código de este proyecto en GitHub" title="Ver el proyecto en GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 00-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 015.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0012 .5z"/></svg>
    </a>
  </div>

  <!-- Se carga al final para que todos los elementos de arriba ya existan. -->
  <script src="app.js"></script>
</body>
</html>
